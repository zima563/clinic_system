version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clinic_system_db
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - clinic_network

  # Clinic Backend Service
  backend:
    build:
      context: ./clinic-backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/clinic_system_db
      JWT_KEY: CLINIC_SYSTEM_SECRET_KEY_510
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      - mysql
    networks:
      - clinic_network

  # Clinic Frontend Service (Nginx)
  frontend:
    build:
      context: ./surgi-clinic-fe
      dockerfile: Dockerfile
    container_name: clinic_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - clinic_network

volumes:
  mysql_data:

networks:
  clinic_network:
    driver: bridge
